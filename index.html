<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Sky</title>
<meta name="theme-color" content="#0b0920">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Sky">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400&family=Jost:wght@300;400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>

<nav class="topbar">
  <button class="ic" id="prev" aria-label="Previous day">‹</button>
  <button class="datebtn" id="datebtn"><span id="dlabel">—</span><input type="date" id="datepick" aria-label="Pick a date"></button>
  <button class="ic" id="next" aria-label="Next day">›</button>
  <button class="ic small" id="today" aria-label="Back to today">◉</button>
  <button class="ic small" id="settingsBtn" aria-label="Settings">✦</button>
</nav>

<main class="wrap" id="app"></main>

<dialog id="setup">
  <form id="setupForm" method="dialog">
    <h2>Your birth sky</h2>
    <p class="note">Stays on this phone only. Nothing is sent anywhere.</p>
    <label>Name <input id="f-name" required autocomplete="off"></label>
    <div class="row2">
      <label>Birth date <input id="f-date" type="date" required></label>
      <label>Birth time <input id="f-time" type="time" required></label>
    </div>
    <label>Birthplace
      <input id="f-city" list="f-cities" autocomplete="off" placeholder="Start typing a city, e.g. Tehran">
      <datalist id="f-cities"></datalist>
      <small class="hint">About 300 cities worldwide. Not listed? Pick the nearest big city, or type its coordinates and a time zone like Asia/Tehran below.</small>
    </label>
    <div class="row3">
      <label>Latitude <input id="f-lat" type="number" step="0.0001" required></label>
      <label>Longitude <input id="f-lon" type="number" step="0.0001" required></label>
      <label>Birth time zone <input id="f-btz" required placeholder="Europe/Paris"></label>
    </div>
    <label>Where you live (time zone) <input id="f-tz" required placeholder="Europe/Berlin"></label>
    <label>Style <select id="f-mode"><option value="simple">Essential: plain language</option><option value="full">Deeper: all the systems</option></select></label>
    <label>Link to your written daily reading (optional) <input id="f-link" type="url" placeholder="https://claude.ai/artifact/…"></label>
    <div class="actions"><button type="button" id="cancelSetup" class="ghost">Cancel</button><button type="submit" class="gold">Save</button></div>
  </form>
</dialog>

<script src="astronomy.browser.min.js"></script>
<script src="engine.js"></script>
<script src="lore.js"></script>
<script src="cities.js"></script>
<script src="app.js"></script>
</body>
</html>
